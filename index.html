<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARehT Corporate</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f7f9fc;
        color: #1a1a1a;
    }

    /* Top Navigation Bar */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 25px;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* Back Button */
    .back-btn {
        font-size: 16px;
        color: #0056d2;
        cursor: pointer;
        font-weight: 500;
        transition: 0.3s ease;
        text-decoration: none;
    }
    .back-btn:hover {
        color: #003c94;
    }

    /* Right Menu */
    .menu a {
        margin-left: 20px;
        text-decoration: none;
        color: #1a1a1a;
        font-size: 15px;
        font-weight: 500;
        transition: 0.3s ease;
    }
    .menu a:hover {
        color: #0056d2;
    }

    /* Center Content */
    .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        padding: 20px;
    }

    /* Corporate Logo */
    .logo {
        font-size: 72px;
        font-weight: 600;
        letter-spacing: 2px;
        opacity: 0;
        animation: fadeInLogo 1.8s ease forwards;
        animation-delay: 0.5s;
    }

    .blue { color: #0056d2; }
    .orange { color: #e67e22; }

    @keyframes fadeInLogo {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Story Section */
    .story {
        font-size: 20px;
        margin-top: 30px;
        max-width: 750px;
        text-align: center;
        line-height: 1.7;
        opacity: 0;
        animation: fadeInStory 1.8s ease forwards;
        animation-delay: 1.5s;
        color: #444;
    }

    @keyframes fadeInStory {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<script>
    function goBack() {
        window.history.back();
    }
</script>

</head>
<body>

<!-- Top Navigation -->
<div class="top-bar">
    <a class="back-btn" onclick="goBack()">← Back</a>

    <div class="menu">
        <a href="#">Games</a>
        <a href="#">Mail</a>
        <a href="#">Images</a>
        <a href="#">Login</a>
    </div>
</div>

<!-- Center Content -->
<div class="center">

    <!-- Corporate Logo -->
    <div class="logo">
        <span class="blue">A</span><span class="blue">R</span><span class="orange">eh</span><span class="blue">T</span>
    </div>

    <!-- Story -->
    <div class="story">
        The name <strong>ARehT</strong> is built from two meaningful origins:<br><br>
        <strong>Ra</strong> — from <em>Ramachandra</em>, father of co‑founder Narasimha.<br>
        <strong>The</strong> — from <em>Thejovathi</em>, mother of the co‑founder.<br><br>
        Together, these elements form a name that reflects heritage, integrity, and purpose — <strong>ARehT</strong>.
    </div>

</div>

</body>
</html>
