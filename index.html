<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARehT</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        color: #222;
    }

    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 25px;
        background: #ffffff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 26px;
        font-weight: bold;
        color: #2a7ae2;
    }

    .tagline {
        font-size: 12px;
        color: #444;
        margin-top: -5px;
    }

    .header-icons {
        display: flex;
        gap: 20px;
        font-size: 20px;
        cursor: pointer;
    }

    /* Trapezoid Search Box */
    .trapezoid {
        margin: 40px auto;
        width: 90%;
        max-width: 600px;
        background: #ffffff;
        padding: 30px;
        clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        text-align: center;
    }

    .trapezoid h1 {
        margin: 0;
        font-size: 32px;
        color: #2a7ae2;
        font-weight: bold;
    }

    .search-bar {
        margin-top: 20px;
        display: flex;
        background: #f1f3f4;
        border-radius: 25px;
        padding: 10px 15px;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }

    .search-bar input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 16px;
        outline: none;
    }

    /* Category Grid */
    .grid {
        margin: 40px auto;
        width: 90%;
        max-width: 900px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
    }

    .item {
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        cursor: pointer;
        transition: 0.2s;
    }

    .item:hover {
        background: #e8f0fe;
        transform: translateY(-3px);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .trapezoid h1 {
            font-size: 26px;
        }
        .item {
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <div>
        <div class="logo">ARehT</div>
        <div class="tagline">Earth → ARehT ← Heart</div>
    </div>

    <div class="header-icons">
        <span>🏠</span>
        <span>🔍</span>
        <span>🔲</span>
    </div>
</div>

<!-- Trapezoid Search Section -->
<div class="trapezoid">
    <h1>ARehT</h1>
    <div class="search-bar">
        <input type="text" placeholder="Search ARehT services...">
    </div>
</div>

<!-- Category Grid -->
<div class="grid">
    <div class="item">Nature Trips</div>
    <div class="item">Farm</div>
    <div class="item">Education</div>
    <div class="item">Family Tree</div>
    <div class="item">Transport</div>
    <div class="item">Architecture</div>
    <div class="item">Real Estate</div>

    <div class="item">Digital Shopping</div>
    <div class="item">Machinery</div>
    <div class="item">Convey</div>
    <div class="item">Earth</div>
    <div class="item">CSR</div>
    <div class="item">News</div>
</div>

</body>
</html>
