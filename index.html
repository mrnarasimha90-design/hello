<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ARehT Trapezoid Search</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
    }

    /* Trapezoidal search bar container */
    .trapezoid-wrapper {
      margin: 40px auto;
      width: 420px;
      position: relative;
      perspective: 800px;
    }

    .trapezoid {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 18px 24px;
      border-radius: 10px;
      transform: skewX(-12deg);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .trapezoid-inner {
      transform: skewX(12deg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trapezoid-inner input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .trapezoid-inner button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: #0f172a;
      color: #f9fafb;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .trapezoid-inner button:hover {
      background: #020617;
      transform: translateY(-1px);
    }

    /* ARehT branding with human-liking images */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #22c55e;
      text-shadow: 0 0 18px rgba(34, 197, 94, 0.7);
    }

    .brand-subtitle {
      font-size: 14px;
      color: #cbd5f5;
    }

    .human-liking-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .human-card {
      background: #1e293b;
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.7);
    }

    .human-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #fb7185);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .human-text {
      font-size: 12px;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .heart {
      color: #fb7185;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ARehT branding -->
    <div class="brand">
      <div class="brand-title">ARehT</div>
      <div class="brand-subtitle">
        Discover what humans love—search ideas, inspirations, and experiences.
      </div>

      <!-- Human liking images / avatars -->
      <div class="human-liking-row">
        <div class="human-card">
          <div class="human-avatar">A</div>
          <div class="human-text">
            <span class="heart">❤️</span> “ARehT makes my searches feel human.”
          </div>
        </div>
        <div class="human-card">
          <div class="human-avatar">R</div>
          <div class="human-text">
            <span class="heart">💚</span> “I find what I truly care about.”
          </div>
        </div>
        <div class="human-card">
          <div class="human-avatar">T</div>
          <div class="human-text">
            <span class="heart">💙</span> “Clean design, human‑first results.”
          </div>
        </div>
      </div>
    </div>

    <!-- Trapezoidal search bar -->
    <div class="trapezoid-wrapper">
      <div class="trapezoid">
        <form class="trapezoid-inner" action="#" method="get">
          <input
            type="text"
            name="q"
            placeholder="Search with ARehT..."
            aria-label="Search"
          />
          <button type="submit">Search</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
