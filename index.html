<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARehT Search</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #202124;
        overflow-x: hidden;
    }

    /* Center container */
    .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    /* Final Logo */
    .logo {
        font-size: 72px;
        font-weight: bold;
        letter-spacing: 3px;
        opacity: 0;
        animation: fadeInLogo 2s ease forwards;
        animation-delay: 3s;
    }

    .blue {
        color: #1a73e8; /* Bright Google Blue */
    }

    .orange {
        color: #ff8c00; /* Orange */
    }

    /* Story text animation */
    .story {
        font-size: 22px;
        margin-top: 20px;
        opacity: 0;
        animation: fadeInStory 2s ease forwards;
        animation-delay: 5s;
        text-align: center;
        max-width: 700px;
        line-height: 1.6;
    }

    /* Ra + The animation */
    .origin {
        font-size: 48px;
        font-weight: bold;
        opacity: 0;
        animation: fadeInOrigin 2s ease forwards;
        animation-delay: 1s;
    }

    @keyframes fadeInOrigin {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLogo {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInStory {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Subtle underline animation */
    .underline {
        width: 0;
        height: 4px;
        background: #1a73e8;
        margin-top: 10px;
        animation: underlineGrow 2s ease forwards;
        animation-delay: 3.5s;
    }

    @keyframes underlineGrow {
        from { width: 0; }
        to { width: 180px; }
    }
</style>
</head>

<body>

<div class="center">

    <!-- Origin animation -->
    <div class="origin">
        <span class="blue">Ra</span> + <span class="orange">The</span>
    </div>

    <!-- Final logo -->
    <div class="logo">
        <span class="blue">A</span><span class="blue">R</span><span class="orange">eh</span><span class="blue">T</span>
    </div>

    <div class="underline"></div>

    <!-- Story text -->
    <div class="story">
        The name <strong>ARehT</strong> is derived from two beloved inspirations:<br><br>
        <strong>Ra</strong> — from <em>Ramachandra</em>, father of co‑founder Narasimha.<br>
        <strong>The</strong> — from <em>Thejovathi</em>, mother of the co‑founder.<br><br>
        Together, these meaningful fragments form the identity of the company — <strong>ARehT</strong>.
    </div>

</div>

</body>
</html>
